<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;width:1408px;height:768px;background:#fff}</style></head><body><object data="logo.svg" type="image/svg+xml" id="o" style="width:1408px;height:768px;display:block"></object><canvas id="c" width="1408" height="768" style="display:none"></canvas><script>
(async()=>{const ctx=document.getElementById('c').getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,1408,768);try{ctx.drawImage(document.getElementById('o'),0,0)}catch(e){document.getElementById('o').addEventListener('load',()=>{ctx.drawImage(document.getElementById('o'),0,0);scan()});return}scan();function scan(){const d=ctx.getImageData(0,0,1408,768).data;let n=0,rs=0,gs=0,bs=0,minX=1408,minY=768,maxX=0,maxY=0;const px=function(i){return d[i+3]?true:false};for(let y=0;y<768;y++)for(let x=0;x<1408;x++){const i=(y*1408+x)*4;if(d[i+3]>0){n++;rs+=d[i];gs+=d[i+1];bs+=d[i+2];if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}const w=maxX-minX+1,h=maxY-minY+1;document.title='DONE';const out='boxX='+minX+' boxY='+minY+' boxW='+w+' boxH='+h+' aspect='+((w/h).toFixed(3))+' opaque='+n+' avgRGB='+Math.round(rs/n)+','+Math.round(gs/n)+','+Math.round(bs/n);document.body.insertAdjacentHTML('beforeend','<pre id="r">'+out+'</pre>');}})();
</script></body></html>
