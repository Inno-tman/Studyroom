<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ResVibe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" href="icons/favicon-32x32.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ResVibe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="theme-init.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="offline-splash" style="position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:#0F172A;color:#F1F5F9;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;">
      <div>
        <img src="/icons/icon-512x512.png" alt="ResVibe" style="width:96px;height:96px;margin:0 auto 24px;display:block;border-radius:20px;" />
        <div style="font-size:22px;font-weight:700;margin-bottom:10px;">Connecting you to ResVibe...</div>
        <div style="font-size:14px;color:#94A3B8;line-height:1.5;">Please make sure your device is connected to the internet.</div>
      </div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('offline-splash');
        function update() {
          if (!splash) return;
          splash.style.display = navigator.onLine ? 'none' : 'flex';
        }
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        update();
      })();
    </script>

    <app-root></app-root>
  </body>
</html>
